server:
  port: 8082

spring:
  application:
    name: service-b

# HttpClient配置
http:
  client:
    connect-timeout: 5000
    socket-timeout: 10000
    max-total: 200
    default-max-per-route: 50
    time-to-live: 60
    enable-pool: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
      service-a:
        connectTimeout: 3000
        readTimeout: 10000

# Resilience4j 配置 - 仅使用线程池隔离舱壁 (ThreadPoolBulkhead)
# 思路: 下游变慢/过载时,调用在独立的有界线程池中执行;
#       当线程池 + 队列都满时,新请求立即被拒绝 (BulkheadFullException),
#       避免调用线程堆积拖垮本服务。
# 注意: 本项目不使用熔断器 (CircuitBreaker),只靠线程池隔离感知下游压力。
# 配置三层结构: configs(模板) -> instances(实例,引用模板) -> 代码按实例名使用
resilience4j:

  # ===================== 线程池隔离舱壁 (ThreadPoolBulkhead) =====================
  # 把对下游的调用放到一个有界的独立线程池中执行:
  # - 下游变慢时,只有这个隔离池里的线程在等待,不影响本服务其它请求线程;
  # - 线程池满且队列满时,新请求立即抛 BulkheadFullException,不阻塞调用线程。
  thread-pool-bulkhead:
    # ★ 线程池隔离开关(自定义属性,Resilience4j 不识别,由 HttpClientTemplate / ServiceACaller 读取)
    #   true  (默认): 启用隔离,池+队列满时立即拒绝
    #   false        : 关闭隔离,调用线程直通(在当前线程同步执行下游调用,不隔离、不拒绝)
    enabled: true
    configs:
      default:
        # 隔离线程池最大线程数 = 同时执行下游调用的最大线程数
        max-thread-pool-size: 10
        # 核心线程数(常驻)
        core-thread-pool-size: 10
        # 等待队列容量: 线程池满后,多余请求在此排队;队列也满时才立即拒绝
        queue-capacity: 20
        # 空闲线程存活时长(仅对超出 core 的线程生效)
        keep-alive-duration: 1m
    #instances:
      # SDK 的 ServiceACaller (Feign 调用 service-a) 使用的隔离舱
    #  service-a:
    #    base-config: default
      # HttpClientTemplate 调用外部用户 API 使用的隔离舱
    #  externalUserApi:
    #    base-config: default
      # 慢调用演示接口使用的隔离舱
    #  slowApi:
    #    base-config: default
      # 重置计数器接口使用的隔离舱
    #  resetCounter:
    #    base-config: default

logging:
  level:
    #com.example.serviceb.httpclient: DEBUG
    io.github.resilience4j: DEBUG
